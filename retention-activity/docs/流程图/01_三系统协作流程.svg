<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1270" viewBox="0 0 1200 1270" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4a6078"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#182e46} .line{fill:none;stroke:#4a6078;stroke-width:3;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text x="40" y="64" font-size="42" text-anchor="start" style="fill:#142f4c;font-weight:600">保客活动创建与选券协作流程</text><text x="40" y="112" font-size="24" text-anchor="start" style="fill:#62748b;font-weight:400">准入配置先确定，卡券中心按准入等级和业务场景过滤。</text><rect x="40" y="156" width="360" height="1024" rx="14" fill="#fafbfd" stroke="#dde5ee"/><rect x="40" y="156" width="360" height="55" rx="12" fill="#e8eff8"/><text x="220" y="192" font-size="29" text-anchor="middle" style="fill:#183c66;font-weight:600">管理后台前端</text><rect x="420" y="156" width="360" height="1024" rx="14" fill="#fafbfd" stroke="#dde5ee"/><rect x="420" y="156" width="360" height="55" rx="12" fill="#e8eff8"/><text x="600" y="192" font-size="29" text-anchor="middle" style="fill:#183c66;font-weight:600">活动中心后端</text><rect x="800" y="156" width="360" height="1024" rx="14" fill="#fafbfd" stroke="#dde5ee"/><rect x="800" y="156" width="360" height="55" rx="12" fill="#e8eff8"/><text x="980" y="192" font-size="29" text-anchor="middle" style="fill:#183c66;font-weight:600">卡券中心</text><g id="A1"><rect x="64" y="244" width="312" height="120" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="220" y="280.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">step1 设置准入等级</text><text x="220" y="316.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">号码级只允许选人</text><text x="220" y="349.5" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">F10、F14</text></g><g id="A2"><rect x="64" y="419" width="312" height="112" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="220" y="451.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">step2 选择业务场景</text><text x="220" y="487.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">发起关联卡券查询</text><text x="220" y="520.5" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">F16</text></g><g id="B1"><rect x="444" y="419" width="312" height="112" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="600" y="451.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">传递准入、场景</text><text x="600" y="487.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">搜索和分页条件</text><text x="600" y="520.5" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">F06</text></g><g id="C1"><rect x="824" y="419" width="312" height="170" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="980" y="462.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">号码级先限用户规则</text><text x="980" y="498.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">两类场景再限线上核销</text><text x="980" y="534.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">详细判断见过滤流程</text><text x="980" y="567.5" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">F01–F04</text></g><g id="C2"><rect x="824" y="677" width="312" height="125" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="980" y="716" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">返回过滤后的列表</text><text x="980" y="752" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">总数及分页信息</text><text x="980" y="785" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">F04、F05</text></g><g id="B2"><rect x="444" y="677" width="312" height="125" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="600" y="716" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">映射接口返回结果</text><text x="600" y="752" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">向管理后台返回</text><text x="600" y="785" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">F07</text></g><g id="A3"><rect x="64" y="677" width="312" height="125" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="220" y="716" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">展示合规候选卡券</text><text x="220" y="752" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">选择并带回关联结果</text><text x="220" y="785" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">F17</text></g><g id="A4"><rect x="64" y="886" width="312" height="155" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="220" y="922" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">step3 联动活动属性</text><text x="220" y="958" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">自动锁定用户标识</text><text x="220" y="994" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">按最终配置提交</text><text x="220" y="1027" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">F11–F15</text></g><g id="B3"><rect x="444" y="886" width="312" height="155" rx="12" fill="#fffaf0" stroke="#ab7d36" stroke-width="2" stroke-dasharray="9 6"/><text x="600" y="922" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">提交时复核每张券</text><text x="600" y="958" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">按当前准入与券场景</text><text x="600" y="994" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">检查关联是否合规</text><text x="600" y="1027" font-size="20" text-anchor="middle" style="fill:#906525;font-weight:400">F09 · 实现建议</text></g><path class="line" d="M220 364V419" /><path class="line" d="M376 475H444" /><path class="line" d="M756 475H824" /><path class="line" d="M980 589V677" /><path class="line" d="M824 739H756" /><path class="line" d="M444 739H376" /><path class="line" d="M220 802V886" /><path class="line" d="M376 954H444" stroke-dasharray="9 6"/><rect x="836" y="611" width="288" height="36" fill="#fafbfd"/><text x="980" y="637" font-size="22" text-anchor="middle" style="fill:#8f6828;font-weight:400">先过滤后分页（建议）</text><text x="64" y="1078" font-size="22" text-anchor="start" style="fill:#62748b;font-weight:400">F18 配置切换与旧草稿</text><text x="64" y="1106" font-size="22" text-anchor="start" style="fill:#62748b;font-weight:400">冲突处理策略见文档</text><text x="64" y="1138" font-size="22" text-anchor="start" style="fill:#62748b;font-weight:400">F08 接口异常与兼容</text><text x="64" y="1166" font-size="22" text-anchor="start" style="fill:#62748b;font-weight:400">具体方案见待确认事项</text><text x="40" y="1225" font-size="24" text-anchor="start" style="fill:#906525;font-weight:400">虚线框和虚线箭头：实现建议，具体责任与合同待确认。</text></svg>
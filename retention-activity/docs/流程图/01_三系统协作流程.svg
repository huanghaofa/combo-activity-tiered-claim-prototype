<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1370" viewBox="0 0 1200 1370" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4a6078"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#182e46}.line{fill:none;stroke:#4a6078;stroke-width:3;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text x="40" y="64" font-size="42" text-anchor="start" style="fill:#142f4c;font-weight:600">保客活动创建与选券协作流程</text><text x="40" y="112" font-size="24" text-anchor="start" style="fill:#62748b;font-weight:400">卡券中心已提供字段，活动中心后端按准入与卡券场景过滤。</text><rect x="40" y="156" width="360" height="1094" rx="14" fill="#fafbfd" stroke="#dde5ee"/><rect x="40" y="156" width="360" height="55" rx="12" fill="#e8eff8"/><text x="220" y="192" font-size="29" text-anchor="middle" style="fill:#183c66;font-weight:600">管理后台前端</text><rect x="420" y="156" width="360" height="1094" rx="14" fill="#fafbfd" stroke="#dde5ee"/><rect x="420" y="156" width="360" height="55" rx="12" fill="#e8eff8"/><text x="600" y="192" font-size="29" text-anchor="middle" style="fill:#183c66;font-weight:600">活动中心后端</text><rect x="800" y="156" width="360" height="1094" rx="14" fill="#fafbfd" stroke="#dde5ee"/><rect x="800" y="156" width="360" height="55" rx="12" fill="#e8eff8"/><text x="980" y="192" font-size="29" text-anchor="middle" style="fill:#183c66;font-weight:600">卡券中心</text><g id="A1"><rect x="64" y="240" width="312" height="110" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="220" y="271.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">step1 设置准入等级</text><text x="220" y="307.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">号码级只允许选人</text><text x="220" y="340.5" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">F10、F14</text></g><g id="A2"><rect x="64" y="395" width="312" height="112" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="220" y="427.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">step2 选择业务场景</text><text x="220" y="463.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">提交准入与查询条件</text><text x="220" y="496.5" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">F16</text></g><g id="B1"><rect x="444" y="395" width="312" height="112" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="600" y="427.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">接收并保留活动准入</text><text x="600" y="463.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">按原合同调用查询</text><text x="600" y="496.5" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">F06</text></g><g id="C1"><rect x="824" y="395" width="312" height="112" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="980" y="427.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">沿用既有查询接口</text><text x="980" y="463.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">无需新增准入参数</text><text x="980" y="496.5" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">F01 · 既有能力</text></g><g id="C2"><rect x="824" y="575" width="312" height="152" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="980" y="609.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">返回既有卡券数据</text><text x="980" y="645.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">场景、领取规则</text><text x="980" y="681.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">核销方式等字段</text><text x="980" y="714.5" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">S04 · 已提供</text></g><g id="B2"><rect x="444" y="555" width="312" height="200" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="600" y="595.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">按准入与卡券场景过滤</text><text x="600" y="631.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">号码级只保留用户规则</text><text x="600" y="667.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">两场景再限线上核销</text><text x="600" y="703.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">两条件为“且”</text><text x="600" y="736.5" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">F02、F03、F05</text></g><g id="B4"><rect x="444" y="825" width="312" height="112" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="600" y="857.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">基于完整过滤结果</text><text x="600" y="893.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">返回列表及分页</text><text x="600" y="926.5" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">F04、F07</text></g><g id="A3"><rect x="64" y="825" width="312" height="112" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="220" y="857.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">展示合规候选卡券</text><text x="220" y="893.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">选择并带回关联结果</text><text x="220" y="926.5" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">F17</text></g><g id="A4"><rect x="64" y="1010" width="312" height="155" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="220" y="1046" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">step3 联动活动属性</text><text x="220" y="1082" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">自动锁定用户标识</text><text x="220" y="1118" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">按最终配置提交</text><text x="220" y="1151" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">F11–F15</text></g><g id="B3"><rect x="444" y="1010" width="312" height="155" rx="12" fill="#fffaf0" stroke="#ab7d36" stroke-width="2" stroke-dasharray="9 6"/><text x="600" y="1046" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">提交时复核每张券</text><text x="600" y="1082" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">按当前准入与券场景</text><text x="600" y="1118" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">检查关联是否合规</text><text x="600" y="1151" font-size="20" text-anchor="middle" style="fill:#906525;font-weight:400">F09 · 实现建议</text></g><path class="line" d="M220 350V395" /><path class="line" d="M376 451H444" /><path class="line" d="M756 451H824" /><path class="line" d="M980 507V575" /><path class="line" d="M824 651H756" /><path class="line" d="M600 755V825" /><path class="line" d="M444 881H376" /><path class="line" d="M220 937V1010" /><path class="line" d="M376 1085H444" stroke-dasharray="9 6"/><text x="980" y="840" font-size="24" text-anchor="middle" style="fill:#62748b;font-weight:400">卡券中心本次无新增</text><text x="980" y="877" font-size="24" text-anchor="middle" style="fill:#62748b;font-weight:400">准入过滤开发要求</text><text x="64" y="1220" font-size="22" text-anchor="start" style="fill:#62748b;font-weight:400">配置切换与旧草稿见 F18</text><text x="40" y="1300" font-size="24" text-anchor="start" style="fill:#906525;font-weight:400">分页衔接方案见 Q05；虚线为提交复核建议，时点及历史范围见 Q06。</text></svg>
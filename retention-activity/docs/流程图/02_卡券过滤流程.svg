<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1390" viewBox="0 0 1200 1390" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4a6078"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#182e46}.line{fill:none;stroke:#4a6078;stroke-width:3;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text x="40" y="64" font-size="42" text-anchor="start" style="fill:#142f4c;font-weight:600">号码级活动关联卡券过滤流程</text><text x="40" y="110" font-size="24" text-anchor="start" style="fill:#62748b;font-weight:400">执行主体：活动中心后端；依据：卡券中心既有接口已返回的字段</text><g id="Q0"><rect x="350" y="139" width="500" height="100" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="600" y="181" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">读取当前活动准入等级</text><text x="600" y="217" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">接收卡券中心既有接口返回数据</text></g><g id="D1"><path d="M600 250L795 325L600 400L405 325Z" fill="#eaf3ff" stroke="#7da6d1" stroke-width="2"/><text x="600" y="335" font-size="28" text-anchor="middle" style="fill:#182e46;font-weight:400">准入是否为号码级？</text></g><g id="Q1"><rect x="370" y="450" width="460" height="90" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="600" y="489.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">仅保留领取规则=用户的卡券</text><text x="600" y="522.5" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">R08</text></g><g id="Q2"><rect x="32" y="450" width="250" height="136" rx="12" fill="#f7f8fa" stroke="#8daecf" stroke-width="2" /><text x="157" y="492" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">非号码级</text><text x="157" y="528" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">不附加本次限制</text><text x="157" y="564" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">执行既有条件</text></g><g id="D2"><path d="M600 593L845 688L600 783L355 688Z" fill="#eaf3ff" stroke="#7da6d1" stroke-width="2"/><text x="600" y="680" font-size="28" text-anchor="middle" style="fill:#182e46;font-weight:400">卡券场景为 BIMC（新）</text><text x="600" y="716" font-size="28" text-anchor="middle" style="fill:#182e46;font-weight:400">或维修保养（新）？</text></g><g id="Q3"><rect x="380" y="844" width="440" height="125" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="600" y="883" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">叠加核销方式=线上核销</text><text x="600" y="919" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">与用户领取规则为且</text><text x="600" y="952" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">R09</text></g><g id="Q4"><rect x="884" y="835" width="278" height="125" rx="12" fill="#f7f8fa" stroke="#8daecf" stroke-width="2" /><text x="1023" y="871.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">其他场景</text><text x="1023" y="907.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">不追加本次</text><text x="1023" y="943.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">核销方式限制</text></g><g id="Q5"><rect x="365" y="1081" width="470" height="106" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="600" y="1110.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">保留全部既有关联和搜索条件</text><text x="600" y="1146.5" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">基于完整过滤结果统计总数、分页</text><text x="600" y="1179.5" font-size="20" text-anchor="middle" style="fill:#60748d;font-weight:400">活动中心分页衔接方案见 Q05</text></g><g id="Q6"><rect x="365" y="1241" width="470" height="80" rx="12" fill="#f1f6fc" stroke="#8daecf" stroke-width="2" /><text x="600" y="1291" font-size="26" text-anchor="middle" style="fill:#182e46;font-weight:400">活动中心向前端返回合规候选券</text></g><path class="line" d="M600 239V250" /><path class="line" d="M600 400V450" /><path class="line" d="M405 325H157V450" /><path class="line" d="M600 540V593" /><path class="line" d="M600 783V844" /><path class="line" d="M845 688H1023V835" /><path class="line" d="M600 969V1081" /><path class="line" d="M1023 960V1025H608" /><path class="line" d="M157 586V1025H592" /><path class="line" d="M600 1187V1241" /><text x="624" y="432" font-size="24" text-anchor="start" style="fill:#182e46;font-weight:400">是</text><text x="292" y="308" font-size="24" text-anchor="middle" style="fill:#182e46;font-weight:400">否</text><text x="624" y="820" font-size="24" text-anchor="start" style="fill:#182e46;font-weight:400">是</text><text x="926" y="670" font-size="24" text-anchor="middle" style="fill:#182e46;font-weight:400">否</text><text x="40" y="1364" font-size="23" text-anchor="start" style="fill:#62748b;font-weight:400">精确匹配线上核销：线下、到店、线上线下组合及缺失/未知值均不满足。</text></svg>